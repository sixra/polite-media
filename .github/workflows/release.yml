# Publishes on a pushed v* tag. See RELEASING.md for what decides the version.
#
# npm's trusted publisher config names this filename explicitly, so renaming it
# stops publishing silently rather than loudly.
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Separate from publish because `pnpm dlx` fetches publint and attw unpinned at
  # job time, which must not happen beside the `id-token: write` credential.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: true

      - run: pnpm verify
      - run: pnpm dlx publint
      - run: pnpm dlx @arethetypeswrong/cli --pack --ignore-rules no-resolution cjs-resolves-to-esm

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # OIDC, in place of a long-lived token
      contents: write # the last step creates the GitHub Release
    steps:
      - uses: actions/checkout@v7

      # Installs the dependencies `prepack` builds with.
      - uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: false

      # Last, so its npm wins the PATH. No `registry-url`: that writes an .npmrc
      # holding `_authToken=${NODE_AUTH_TOKEN}`, and with no secret to fill in, npm
      # sends the placeholder as a credential and never reaches OIDC.
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Ensure npm can do trusted publishing
        run: |
          need=11.5.1
          have=$(npm --version)
          echo "npm $have"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "npm $have is older than the $need trusted publishing requires" >&2
            exit 1
          fi

      # Trusted publishing attaches the provenance attestation, so no --provenance.
      - run: npm publish --access public

      - name: Create the GitHub Release from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --notes-from-tag
