<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>polite-media — source fallback</title>
    <link rel="stylesheet" href="/dist/video.css" />
    <link rel="stylesheet" href="/demo/demo.css" />
  </head>
  <body>
    <header>
      <h1>Error-driven source fallback</h1>
      <p class="note">
        Left: a truncated AV1 first, a good H.264 second — the browser answers "probably" for the
        AV1, then fails at decode, and the next source takes over. Right: nothing decodable at all,
        so the poster stays for good.
      </p>
      <nav><a href="/demo/">all demos</a></nav>
    </header>

    <main>
      <div class="sizes">
        <div class="frame wide" data-polite-media id="recovers">
          <img src="/demo/assets/sample-poster.avif" alt="" />
          <video muted loop playsinline preload="none" tabindex="-1" aria-hidden="true">
            <source
              src="/demo/assets/sample-truncated-av1.mp4"
              type='video/mp4; codecs="av01.0.08M.08"'
            />
            <source src="/demo/assets/sample-h264.mp4" type="video/mp4" />
          </video>
        </div>

        <div class="frame wide" data-polite-media id="exhausts">
          <img src="/demo/assets/sample-poster.avif" alt="" />
          <video muted loop playsinline preload="none" tabindex="-1" aria-hidden="true">
            <source
              src="/demo/assets/sample-truncated-av1.mp4"
              type='video/mp4; codecs="av01.0.08M.08"'
            />
          </video>
        </div>
      </div>
    </main>

    <div class="controls">
      <!-- A real <button>: the library binds a delegated click, and only a native
           button has Enter and Space synthesised into one. aria-pressed is
           declared here, which is how the library knows to keep it current. -->
      <button data-polite-pause-control type="button" aria-pressed="false">pause / resume</button>
    </div>

    <script type="module">
      import { configure, register } from '/dist/video.js';

      // startWhen: 'page-loaded' rather than the shipped 'interaction' default,
      // because this page is about source fallback and a demo you have to poke
      // before anything happens would only get in the way. demo/interaction.html
      // is the one that shows the default.
      configure({ startWhen: 'page-loaded' });

      const events = [];
      for (const id of ['recovers', 'exhausts']) {
        const frame = document.getElementById(id);
        for (const type of ['ready', 'failed']) {
          frame.addEventListener(`polite-video:${type}`, () => events.push(`${id}:${type}`));
        }
        register(frame.querySelector('video'), { observe: frame });
      }

      window.__events = events;
      window.__state = () => ({
        recoversSrc: document.querySelector('#recovers video').currentSrc.split('/').pop(),
        recoversReady: document.getElementById('recovers').hasAttribute('data-polite-ready'),
        exhaustsFailed: document.getElementById('exhausts').hasAttribute('data-polite-failed'),
      });
    </script>
  </body>
</html>
