<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>polite-media — hero</title>
    <link rel="stylesheet" href="/dist/video.css" />
    <link rel="stylesheet" href="/demo/demo.css" />
  </head>
  <body>
    <header>
      <h1>Above-the-fold hero</h1>
      <p class="note">
        The poster is the LCP candidate, so it is preloaded and never starts hidden. Only the video
        layer cuts in, once a frame has actually painted.
      </p>
      <nav><a href="/demo/">all demos</a></nav>
    </header>

    <main>
      <div class="frame hero" data-polite-media id="hero">
        <img src="/demo/assets/sample-poster.avif" alt="" fetchpriority="high" decoding="async" />
        <video muted loop playsinline preload="none" tabindex="-1" aria-hidden="true">
          <source src="/demo/assets/sample-h264.mp4" type="video/mp4" />
        </video>
      </div>
    </main>

    <div class="controls">
      <!-- A real <button>: the library binds a delegated click, and only a native
           button has Enter and Space synthesised into one. aria-pressed is
           declared here, which is how the library knows to keep it current. -->
      <button data-polite-pause-control type="button" aria-pressed="false">pause / resume</button>
    </div>

    <script type="module">
      import { configure, register } from '/dist/video.js';

      // startWhen: 'page-loaded' rather than the shipped 'interaction' default,
      // because this page is about the reveal and a demo you have to poke
      // before anything happens would only get in the way. demo/interaction.html
      // is the one that shows the default.
      configure({ startWhen: 'page-loaded' });

      const hero = document.getElementById('hero');
      const video = hero.querySelector('video');

      // Recorded so the e2e suite can assert the reveal never lands before a
      // frame is presented -- the library's central claim, and the one that is
      // vacuous if only asserted against `playing`.
      const marks = { ready: null, framesAtReveal: null, readyStateAtReveal: null };
      hero.addEventListener('polite-video:ready', () => {
        if (marks.ready !== null) return;
        marks.ready = performance.now();
        // The library's central claim, in the only form that is not
        // codec-dependent: by the time it reveals, a frame exists.
        marks.framesAtReveal = video.getVideoPlaybackQuality?.().totalVideoFrames ?? null;
        marks.readyStateAtReveal = video.readyState;
      });
      window.__marks = marks;

      register(video, { observe: hero });
    </script>
  </body>
</html>
