<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>polite-media — any size</title>
    <link rel="stylesheet" href="/dist/video.css" />
    <link rel="stylesheet" href="/demo/demo.css" />
  </head>
  <body>
    <header>
      <h1>One video, four boxes</h1>
      <p class="note">
        Identical markup and identical source in a 16:9 hero, a 3:4 card, a square thumbnail and a
        640×90 strip. The library sets no width, height or aspect ratio — the page does all of it —
        which is the whole reason it drops into an existing design.
      </p>
      <nav><a href="/demo/">all demos</a></nav>
    </header>

    <main>
      <div class="sizes" id="sizes">
        <div class="frame wide" data-polite-media></div>
        <div class="frame tall" data-polite-media></div>
        <div class="frame square" data-polite-media></div>
        <div class="frame strip" data-polite-media></div>
      </div>
    </main>

    <div class="controls">
      <!-- The other valid pattern, deliberately: this label swaps, so it carries
           NO aria-pressed and the library leaves it alone. "Play, pressed" is
           worse than either half. The swap is driven by polite-video:pausechange,
           because a label is not something CSS can rewrite. -->
      <button data-polite-pause-control type="button">Pause background video</button>
    </div>

    <script type="module">
      import { configure, POLITE_VIDEO_PAUSECHANGE, register } from '/dist/video.js';

      // The label-swapping control, which is only buildable because the library
      // announces the change. Watching data-polite-paused on <html> instead would
      // mean a MutationObserver on the root for one boolean.
      const control = document.querySelector('[data-polite-pause-control]');
      document.addEventListener(POLITE_VIDEO_PAUSECHANGE, (event) => {
        control.textContent = event.detail.paused
          ? 'Play background video'
          : 'Pause background video';
      });

      // Arbitration off, because this page is about geometry: every box should
      // be running at once so the sizes can be compared. Everywhere, not just on
      // desktop, so the demo does not change shape on a phone.
      // startWhen: 'page-loaded' rather than the shipped default: this page is
      // about geometry, not about when playback begins.
      configure({ atOnce: 'all', startWhen: 'page-loaded' });

      const markup = `
        <img src="/demo/assets/sample-poster.avif" alt="" />
        <video muted loop playsinline preload="none" tabindex="-1" aria-hidden="true">
          <source src="/demo/assets/sample-h264.mp4" type="video/mp4" />
        </video>`;

      for (const frame of document.getElementById('sizes').children) {
        frame.innerHTML = markup;
        register(frame.querySelector('video'), { observe: frame });
      }
    </script>
  </body>
</html>
